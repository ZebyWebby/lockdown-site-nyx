name: Sync packwiz pack

# Keeps packwiz/ in step with mods/ and config/ after every push, so nobody has to update it by hand.
on:
  push:
    branches: [main]
    paths: ["mods/**", "config/**", "tools/sync_packwiz.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild packwiz/ from mods/ and config/
        run: python3 tools/sync_packwiz.py
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain packwiz)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packwiz
            git commit -m "Sync packwiz pack with mods/ and config/"
            git push
          else
            echo "packwiz pack already up to date"
          fi
